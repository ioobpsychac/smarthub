<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit SmartHub — Message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* ── Email view ── */
  .view-main { flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  .view-content { flex:1; overflow-y:auto; padding:28px 32px; display:flex; flex-direction:column; gap:0; }

  /* Email format */
  #emailView { display:none; flex-direction:column; gap:0; }
  #emailView.active { display:flex; }
  .email-card {
    background:#fff; border:1px solid #e8e8e6; border-radius:12px;
    overflow:hidden; max-width:720px; width:100%;
  }
  .email-header { padding:20px 24px 16px; border-bottom:1px solid #f0f0ee; }
  .email-subject { font-size:17px; font-weight:600; color:#1a1a1a; margin-bottom:12px; }
  .email-meta { display:flex; align-items:flex-start; gap:12px; }
  .email-av { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:#fff; flex-shrink:0; }
  .email-from-block { flex:1; }
  .email-from-name { font-size:13px; font-weight:600; color:#1a1a1a; }
  .email-from-addr { font-size:12px; color:#888; }
  .email-to { font-size:12px; color:#888; margin-top:2px; }
  .email-time { font-size:12px; color:#aaa; flex-shrink:0; }
  .email-body { padding:20px 24px; font-size:14px; color:#333; line-height:1.7; white-space:pre-wrap; }
  .email-sig { padding:0 24px 20px; font-size:14px; color:#555; white-space:pre-wrap; border-top:1px solid #f5f5f3; padding-top:14px; margin-top:0; }

  /* Reply box (email) */
  .reply-area {
    max-width:720px; width:100%; margin-top:16px;
    background:#fff; border:1px solid #e8e8e6; border-radius:12px; overflow:hidden;
  }
  .reply-header { padding:10px 16px; background:#f9f9f8; border-bottom:1px solid #f0f0ee; font-size:12px; color:#888; }
  .reply-ta { width:100%; min-height:100px; border:none; outline:none; padding:14px 16px; font-size:13px; font-family:'Inter',sans-serif; color:#333; resize:vertical; background:#fff; }
  .reply-footer { padding:10px 16px; border-top:1px solid #f0f0ee; display:flex; justify-content:flex-end; }
  .send-btn { background:#5b6af7; color:#fff; border:none; border-radius:8px; padding:8px 20px; font-size:13px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; transition:background .15s; }
  .send-btn:hover { background:#4a59e8; }

  /* ── Forum/Slack view ── */
  #forumView { display:none; flex-direction:column; height:100%; }
  #forumView.active { display:flex; flex:1; overflow:hidden; }
  .forum-wrap { display:flex; flex-direction:column; height:100%; max-width:780px; width:100%; }
  .forum-channel-header {
    background:#fff; border:1px solid #e8e8e6; border-radius:12px 12px 0 0;
    padding:14px 18px; display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .forum-channel-name { font-size:14px; font-weight:600; color:#1a1a1a; }
  .forum-channel-sub { font-size:12px; color:#888; }
  .forum-messages { flex:1; overflow-y:auto; background:#fff; border-left:1px solid #e8e8e6; border-right:1px solid #e8e8e6; padding:16px 18px; display:flex; flex-direction:column; gap:0; }
  .forum-msg { display:flex; gap:12px; padding:8px 0; }
  .forum-msg .fm-av { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#fff; flex-shrink:0; }
  .forum-msg .fm-body { flex:1; }
  .forum-msg .fm-name { font-size:13px; font-weight:600; color:#1a1a1a; }
  .forum-msg .fm-time { font-size:11px; color:#aaa; margin-left:8px; }
  .forum-msg .fm-text { font-size:14px; color:#333; line-height:1.65; margin-top:3px; white-space:pre-wrap; }
  .forum-msg .fm-sig { font-size:14px; color:#555; margin-top:8px; font-style:italic; }
  .forum-divider { text-align:center; font-size:11px; color:#aaa; padding:10px 0; border-top:1px solid #f0f0ee; margin:8px 0; }
  /* Forum input */
  .forum-input-bar {
    background:#fff; border:1px solid #e8e8e6; border-radius:0 0 12px 12px; border-top:1.5px solid #e8e8e6;
    padding:10px 14px; display:flex; align-items:flex-end; gap:10px; flex-shrink:0;
  }
  .forum-ta {
    flex:1; min-height:38px; max-height:120px; border:1px solid #e0e0de; border-radius:8px;
    padding:8px 12px; font-size:13px; font-family:'Inter',sans-serif; color:#333;
    resize:none; outline:none; overflow-y:auto;
  }
  .forum-ta:focus { border-color:#5b6af7; }
  .forum-send { background:#5b6af7; color:#fff; border:none; border-radius:8px; padding:8px 16px; font-size:13px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; flex-shrink:0; }
  .forum-send:hover { background:#4a59e8; }

  /* Back button */
  .back-btn { display:inline-flex; align-items:center; gap:6px; color:#5b6af7; font-size:13px; font-weight:500; cursor:pointer; background:none; border:none; font-family:'Inter',sans-serif; padding:0; margin-bottom:16px; }
  .back-btn:hover { text-decoration:underline; }
  .back-btn svg { width:14px; height:14px; }

  /* Overlay */
  #tourOverlay { display:none; position:fixed; inset:0; background:rgba(20,20,20,0.58); z-index:500; pointer-events:none; }
  #tourOverlay.active { display:block; }
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<nav class="sidebar">
  <div class="sidebar-header"><div class="workspace-name"><div class="ws-dot">O</div>Orbit Technologies</div></div>
  <div class="sidebar-section">
    <div class="sidebar-section-label">Home</div>
    <div class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Overview</div>
    <div class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>My Tasks</div>
    <div class="sidebar-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Messages<div class="notif-dot"></div></div>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-section-label">Workspace</div>
    <div class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>Q3 Client Rollouts</div>
    <div class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="2" width="8" height="4" rx="1"/><rect x="1" y="16" width="6" height="4" rx="1"/><rect x="9" y="16" width="6" height="4" rx="1"/><rect x="17" y="16" width="6" height="4" rx="1"/><path d="M4 16v-3a1 1 0 011-1h14a1 1 0 011 1v3"/><path d="M12 12V6"/></svg>Org Chart</div>
  </div>
  <div class="sidebar-avatar"><div class="user-avatar">YN</div><div class="avatar-name">You (Director)</div></div>
</nav>

<!-- ── Main ── -->
<div class="view-main">
  <div class="topbar">
    <span class="topbar-title">Messages</span>
    <span class="topbar-sep">/</span>
    <span class="topbar-sub" id="topbarSub">Reading</span>
  </div>

  <div class="view-content" id="viewContent">
    <button class="back-btn" onclick="goBack()" id="backBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
      Back to Messages
    </button>

    <!-- Email view -->
    <div id="emailView">
      <div class="email-card">
        <div class="email-header">
          <div class="email-subject" id="emailSubject"></div>
          <div class="email-meta">
            <div class="email-av" id="emailAv"></div>
            <div class="email-from-block">
              <div class="email-from-name" id="emailFromName"></div>
              <div class="email-from-addr" id="emailFromAddr"></div>
              <div class="email-to" id="emailTo"></div>
            </div>
            <div class="email-time">Today, 3:47 PM</div>
          </div>
        </div>
        <div class="email-body" id="emailBody"></div>
        <div class="email-sig" id="emailSig"></div>
      </div>
      <div class="reply-area">
        <div class="reply-header">Reply to <span id="replyTo"></span></div>
        <textarea class="reply-ta" id="replyTa" placeholder="Write your reply…"></textarea>
        <div class="reply-footer"><button class="send-btn" onclick="sendMsg()">Send</button></div>
      </div>
    </div>

    <!-- Forum view -->
    <div id="forumView">
      <div class="forum-wrap">
        <div class="forum-channel-header">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b6af7" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          <div>
            <div class="forum-channel-name" id="forumChannelName">#client-services-general</div>
            <div class="forum-channel-sub">Public · Client Services team</div>
          </div>
        </div>
        <div class="forum-messages" id="forumMessages"></div>
        <div class="forum-input-bar">
          <textarea class="forum-ta" id="forumTa" placeholder="Message #client-services-general…" rows="1"
            onkeydown="handleForumKey(event)"></textarea>
          <button class="forum-send" onclick="sendMsg()">Send</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ── Tour Overlay ── -->
<div id="tourOverlay"></div>

<!-- ── Sparky ── -->
<div id="sparky" style="display:none;">
  <div id="sparky-char" style="width:90px;height:90px;">
    <svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
      <ellipse cx="45" cy="48" rx="20" ry="26" fill="#5b6af7"/>
      <ellipse cx="45" cy="44" rx="14" ry="14" fill="#fff" opacity=".95"/>
      <circle cx="40" cy="41" r="3" fill="#1a1a1a"/><circle cx="50" cy="41" r="3" fill="#1a1a1a"/>
      <circle cx="41.2" cy="39.8" r="1" fill="#fff"/><circle cx="51.2" cy="39.8" r="1" fill="#fff"/>
      <path d="M39 47 Q45 52 51 47" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="45" y1="22" x2="45" y2="30" stroke="#5b6af7" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="45" cy="20" r="4" fill="#fbbf24"/>
      <ellipse cx="20" cy="52" rx="10" ry="6" fill="#818cf8" transform="rotate(-20 20 52)"/>
      <ellipse cx="70" cy="52" rx="10" ry="6" fill="#818cf8" transform="rotate(20 70 52)"/>
      <ellipse cx="45" cy="77" rx="8" ry="5" fill="#fb923c" opacity=".9"/>
      <ellipse cx="45" cy="80" rx="5" ry="3" fill="#fbbf24" opacity=".8"/>
    </svg>
  </div>
  <div id="sparky-bubble">
    <p id="sparky-text"></p>
    <button class="sparky-btn" id="sparky-btn">Got it →</button>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const condition = parseInt(params.get('c') || '1');
  const msgIndex = parseInt(params.get('i') || '0');
  const msgData = JSON.parse(sessionStorage.getItem('currentMsg') || 'null');

  const overlay = document.getElementById('tourOverlay');
  const sparky = document.getElementById('sparky');
  const sparkyText = document.getElementById('sparky-text');
  const sparkyBtn = document.getElementById('sparky-btn');
  let sent = false;

  /* ── Render ── */
  window.addEventListener('load', () => {
    if (!msgData) { window.location.href = 'messages.html?c=' + condition; return; }
    render(msgData);
  });

  function render(m) {
    document.getElementById('topbarSub').textContent = m.label;

    if (m.type === 'email') {
      document.getElementById('emailView').classList.add('active');
      document.getElementById('emailSubject').textContent = m.subject;
      const av = document.getElementById('emailAv');
      av.textContent = m.initials; av.style.background = m.color;
      document.getElementById('emailFromName').textContent = m.from;
      document.getElementById('emailFromAddr').textContent = m.from.toLowerCase().replace(' ','.') + '@orbit-tech.com';
      document.getElementById('emailTo').textContent = m.ccLine;
      document.getElementById('emailBody').textContent = m.body;
      document.getElementById('emailSig').textContent = m.sig;
      document.getElementById('replyTo').textContent = m.from;
      /* Enter key in reply box */
      document.getElementById('replyTa').addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendMsg();
      });
    } else {
      /* Forum */
      document.getElementById('forumView').classList.add('active');
      const channelEl = document.getElementById('forumChannelName');
      channelEl.textContent = m.ccLine || '#client-services-general';
      /* Render the post */
      const fmArea = document.getElementById('forumMessages');
      const post = document.createElement('div');
      post.className = 'forum-msg';
      post.innerHTML = `
        <div class="fm-av" style="background:${m.color}">${m.initials}</div>
        <div class="fm-body">
          <div><span class="fm-name">${m.from}</span><span class="fm-time">Today 3:47 PM</span></div>
          <div class="fm-text">${m.body.replace(/</g,'&lt;')}</div>
          <div class="fm-sig">${m.sig}</div>
        </div>`;
      fmArea.appendChild(post);
      const div = document.createElement('div');
      div.className = 'forum-divider';
      div.textContent = '— Reply below —';
      fmArea.appendChild(div);
    }
  }

  function handleForumKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  }

  function sendMsg() {
    if (sent) return;
    const ta = document.getElementById(msgData.type === 'email' ? 'replyTa' : 'forumTa');
    const val = ta.value.trim();
    if (!val) { ta.style.borderColor='#ef4444'; setTimeout(()=>ta.style.borderColor='',1200); return; }

    sent = true;
    /* Show reply in forum */
    if (msgData.type === 'forum') {
      const fmArea = document.getElementById('forumMessages');
      const reply = document.createElement('div');
      reply.className = 'forum-msg';
      reply.innerHTML = `
        <div class="fm-av" style="background:#4e55c7">YN</div>
        <div class="fm-body">
          <div><span class="fm-name">You</span><span class="fm-time">Just now</span></div>
          <div class="fm-text">${val.replace(/</g,'&lt;')}</div>
        </div>`;
      fmArea.appendChild(reply);
      fmArea.scrollTop = fmArea.scrollHeight;
      ta.value = ''; ta.disabled = true;
      document.querySelector('.forum-send').disabled = true;
    } else {
      ta.disabled = true;
      document.querySelector('.send-btn').textContent = 'Sent ✓';
      document.querySelector('.send-btn').disabled = true;
    }

    /* Sparky confirmation */
    setTimeout(() => {
      overlay.classList.add('active');
      sparky.style.display = '';
      sparky.style.left = '50%'; sparky.style.top = '50%';
      sparky.style.transform = 'translate(-50%, -50%)';
      document.getElementById('sparky-char').style.cssText = 'width:90px;height:90px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.25));';
      document.getElementById('sparky-bubble').style.display = '';
      sparkyText.innerHTML = 'Great! Now let\'s return to your <strong>messages</strong>.';
      sparkyBtn.textContent = 'Back to messages →';
      sparkyBtn.onclick = () => {
        sessionStorage.setItem('returnFromMsg', String(msgIndex));
        window.location.href = 'messages.html?c=' + condition + '&ret=' + msgIndex;
      };
    }, 600);
  }

  function goBack() {
    /* Only allow back after sending */
    if (!sent) {
      overlay.classList.add('active');
      sparky.style.display = '';
      sparky.style.left = '50%'; sparky.style.top = '50%';
      sparky.style.transform = 'translate(-50%, -50%)';
      document.getElementById('sparky-char').style.cssText = 'width:90px;height:90px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.25));';
      document.getElementById('sparky-bubble').style.display = '';
      sparkyText.innerHTML = 'Please send a reply first — you need to respond before moving on!';
      sparkyBtn.textContent = 'OK, got it';
      sparkyBtn.onclick = () => { overlay.classList.remove('active'); sparky.style.display='none'; };
    } else {
      sessionStorage.setItem('returnFromMsg', String(msgIndex));
      window.location.href = 'messages.html?c=' + condition;
    }
  }
</script>
</body>
</html>
