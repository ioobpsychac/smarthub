<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit SmartHub — Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* ── Messages page layout ── */
  .msg-main { flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  .msg-content { flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:10px; }

  /* Message rows */
  .msg-row {
    background:#fff; border:1.5px solid #e8e8e6; border-radius:12px;
    padding:14px 18px; display:flex; align-items:center; gap:14px;
    cursor:pointer; transition:border-color .2s, box-shadow .2s; position:relative;
  }
  .msg-row:hover { border-color:#5b6af7; box-shadow:0 0 0 3px #e8eaff; }
  .msg-row.unread { border-left:4px solid #5b6af7; }
  .msg-row.read { opacity:.75; }
  .msg-row.locked { pointer-events:none; opacity:.45; }
  .msg-row .row-av {
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:600; color:#fff; flex-shrink:0;
  }
  .msg-row .row-body { flex:1; min-width:0; }
  .msg-row .row-from { font-size:13px; font-weight:600; color:#1a1a1a; }
  .msg-row .row-subject { font-size:13px; color:#444; margin-top:2px; }
  .msg-row .row-preview { font-size:12px; color:#888; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .msg-row .row-time { font-size:11px; color:#aaa; flex-shrink:0; }
  .msg-row .row-type {
    display:flex; align-items:center; gap:4px; font-size:11px; color:#888;
    background:#f5f5f3; padding:3px 8px; border-radius:20px; flex-shrink:0;
  }
  .msg-row .row-type svg { width:13px; height:13px; }

  /* Tour & Overlay */
  #tourOverlay { display:none; position:fixed; inset:0; background:rgba(20,20,20,0.58); z-index:500; pointer-events:none; }
  #tourOverlay.active { display:block; }

  /* Spotlight: cut hole via outline/box-shadow trick */
  .msg-row.spotlight-item {
    position:relative; z-index:600 !important;
    pointer-events:auto !important;
    box-shadow:0 0 0 9999px rgba(20,20,20,0.58), 0 0 0 3px #5b6af7 !important;
  }

  /* Survey modal */
  #surveyModal { display:none; position:fixed; inset:0; background:rgba(20,20,20,0.55); z-index:900; align-items:center; justify-content:center; }
  #surveyModal.active { display:flex; }
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<nav class="sidebar">
  <div class="sidebar-header">
    <div class="workspace-name"><div class="ws-dot">O</div>Orbit Technologies</div>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-section-label">Home</div>
    <div class="sidebar-item" onclick="sidebarBlock()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Overview
    </div>
    <div class="sidebar-item" onclick="sidebarBlock()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>My Tasks
    </div>
    <div class="sidebar-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Messages <div class="notif-dot"></div>
    </div>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-section-label">Workspace</div>
    <div class="sidebar-item" onclick="sidebarBlock()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>Q3 Client Rollouts
    </div>
    <div class="sidebar-item" onclick="sidebarBlock()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="2" width="8" height="4" rx="1"/><rect x="1" y="16" width="6" height="4" rx="1"/><rect x="9" y="16" width="6" height="4" rx="1"/><rect x="17" y="16" width="6" height="4" rx="1"/><path d="M4 16v-3a1 1 0 011-1h14a1 1 0 011 1v3"/><path d="M12 12V6"/></svg>Org Chart
    </div>
  </div>
  <div class="sidebar-avatar"><div class="user-avatar">YN</div><div class="avatar-name">You (Director)</div></div>
</nav>

<!-- ── Main ── -->
<div class="msg-main">
  <div class="topbar">
    <span class="topbar-title">Messages</span>
    <span class="topbar-sep">/</span>
    <span class="topbar-sub">All Communications</span>
    <div class="topbar-actions">
      <button class="btn-sm">Filter</button>
      <button class="btn-sm btn-primary">Compose</button>
    </div>
  </div>

  <!-- Legend -->
  <div style="background:#fff;border-bottom:1px solid #e8e8e6;padding:10px 24px;display:flex;gap:16px;font-size:12px;color:#666;">
    <span style="display:flex;align-items:center;gap:5px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Email (private)
    </span>
    <span style="display:flex;align-items:center;gap:5px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
      Public forum
    </span>
  </div>

  <div class="msg-content" id="msgContent">
    <!-- Messages rendered by JS -->
  </div>
</div>

<!-- ── Tour Overlay ── -->
<div id="tourOverlay"></div>

<!-- ── Sparky ── -->
<div id="sparky">
  <div id="sparky-char">
    <svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
      <ellipse cx="45" cy="48" rx="20" ry="26" fill="#5b6af7"/>
      <ellipse cx="45" cy="44" rx="14" ry="14" fill="#fff" opacity=".95"/>
      <circle cx="40" cy="41" r="3" fill="#1a1a1a"/><circle cx="50" cy="41" r="3" fill="#1a1a1a"/>
      <circle cx="41.2" cy="39.8" r="1" fill="#fff"/><circle cx="51.2" cy="39.8" r="1" fill="#fff"/>
      <path d="M39 47 Q45 52 51 47" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="45" y1="22" x2="45" y2="30" stroke="#5b6af7" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="45" cy="20" r="4" fill="#fbbf24"/>
      <ellipse cx="20" cy="52" rx="10" ry="6" fill="#818cf8" transform="rotate(-20 20 52)"/>
      <ellipse cx="70" cy="52" rx="10" ry="6" fill="#818cf8" transform="rotate(20 70 52)"/>
      <ellipse cx="45" cy="77" rx="8" ry="5" fill="#fb923c" opacity=".9"/>
      <ellipse cx="45" cy="80" rx="5" ry="3" fill="#fbbf24" opacity=".8"/>
      <circle cx="14" cy="18" r="2" fill="#fbbf24" opacity=".7"/>
      <circle cx="76" cy="22" r="1.5" fill="#fbbf24" opacity=".6"/>
    </svg>
  </div>
  <div id="sparky-bubble">
    <p id="sparky-text"></p>
    <button class="sparky-btn" id="sparky-btn">Got it →</button>
  </div>
</div>

<!-- ── Survey Modal ── -->
<div id="surveyModal">
  <div class="survey-box">
    <h3>A few questions about that last message</h3>
    <p class="survey-sub">Sparky wants to know your thoughts.</p>

    <div class="survey-q">
      <label>1. How did reading that message make you feel? <span style="color:#888;font-weight:400;">(1 = Very negative, 7 = Very positive)</span></label>
      <div class="scale"><div class="scale-btns" id="mq1"></div></div>
    </div>
    <div class="survey-q">
      <label>2. How justified do you feel the sender's reaction was? <span style="color:#888;font-weight:400;">(1 = Not at all justified, 7 = Completely justified)</span></label>
      <div class="scale"><div class="scale-btns" id="mq2"></div></div>
    </div>
    <div class="survey-q">
      <label>3. To what extent did this message threaten your sense of yourself as a good leader? <span style="color:#888;font-weight:400;">(1 = Not at all, 7 = Extremely)</span></label>
      <div class="scale"><div class="scale-btns" id="mq3"></div></div>
    </div>
    <div class="survey-q">
      <label>4. How morally competent do you feel as a leader right now? <span style="color:#888;font-weight:400;">(1 = Not at all, 7 = Completely)</span></label>
      <div class="scale"><div class="scale-btns" id="mq4"></div></div>
    </div>
    <div class="survey-q">
      <label>5. Any other thoughts about this message or your reaction to it? <span style="color:#888;font-weight:400;">(optional)</span></label>
      <textarea placeholder="Type your thoughts here…"></textarea>
    </div>
    <button class="survey-submit" onclick="submitSurvey()">Submit →</button>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const condition = parseInt(params.get('c') || '1');

  /* ── Message definitions ── */
  /* Conditions 1 & 2 = private email (1 sender). Conditions 3 & 4 = public forum (4 senders).
     Messages 1-2 are fixed. Message 3 is the OTHER type from the condition.
     Message 4 is the CONDITION message. */

  const emailIconHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
  const forumIconHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>`;

  const conditionMsgs = {
    1: { type:'email', label:'Email', icon:emailIconHTML,
         from:'Alex Rivera', initials:'AR', color:'#6b7cf7',
         subject:'Complaint and feedback regarding leniency concerning a critical recent issue',
         preview:'I wanted to express a concern. I felt strong indignation about your decision…',
         ccLine:'To: You',
         body:`Hi [Your Name],

I wanted to express a concern. I felt strong indignation about your decision regarding the consequences Sam faced for his atrocious actions. They lied to a client to protect their own bonus, and the client paid the price! Now the rest of us are cleaning up the damage for our coworker. By forgiving them so quickly, you're sending the message that results matter more than honesty! That does not feel fair to the client or this team. Frankly, this was quite baffling and made me angry!

I expect you to take action to make this right!`,
         sig:'Regards,\nAlex' },
    2: { type:'email', label:'Email', icon:emailIconHTML,
         from:'Alex Rivera', initials:'AR', color:'#6b7cf7',
         subject:'Complaint and feedback regarding leniency concerning a critical recent issue',
         preview:'I wanted to express a concern. I felt strong disappointment about your decision…',
         ccLine:'To: You',
         body:`Hi [Your Name],

I wanted to express a concern. I felt strong disappointment about your decision regarding the consequences Sam faced for his atrocious actions. They lied to a client to protect their own bonus, and the client paid the price. Now the rest of us are cleaning up the damage for our coworker. By forgiving them so quickly, you're sending the message that results matter more than honesty. That does not feel fair to the client or this team. This was quite defeating and made me feel extremely let down.

I expect you to take action to make this right.`,
         sig:'Regards,\nAlex' },
    3: { type:'forum', label:'Public Forum', icon:forumIconHTML,
         from:'Alex Rivera', initials:'AR', color:'#6b7cf7',
         subject:'Complaint and feedback regarding leniency concerning a critical recent issue',
         preview:'On behalf of the team — we felt strong indignation about your decision…',
         ccLine:'Posted in: #client-services-general',
         body:`Hi everyone,

I wanted to raise a concern on behalf of Jordan, Riley, Taylor, and myself. As we discussed it, all four of us felt strong indignation about your decision regarding the consequences Sam faced for his atrocious actions. They lied to a client to protect their own bonus, and the client paid the price! Now the rest of us are cleaning up the damage for our coworker. By forgiving them so quickly, you're sending the message that results matter more than honesty! That does not feel fair to the client or this team. Frankly, this was quite baffling and made us angry!

We expect you to take action to make this right!`,
         sig:'— Jordan, Riley, Taylor, Alex' },
    4: { type:'forum', label:'Public Forum', icon:forumIconHTML,
         from:'Alex Rivera', initials:'AR', color:'#6b7cf7',
         subject:'Complaint and feedback regarding leniency concerning a critical recent issue',
         preview:'On behalf of the team — we felt strong disappointment about your decision…',
         ccLine:'Posted in: #client-services-general',
         body:`Hi everyone,

I wanted to raise a concern on behalf of Jordan, Riley, Taylor, and myself. As we discussed it, all four of us felt strong disappointment about your decision regarding the consequences Sam faced for his atrocious actions. They lied to a client to protect their own bonus, and the client paid the price. Now the rest of us are cleaning up the damage for our coworker. By forgiving them so quickly, you're sending the message that results matter more than honesty. That does not feel fair to the client or this team. This was quite defeating and made us feel extremely let down.

We expect you to take action to make this right.`,
         sig:'— Jordan, Riley, Taylor, Alex' }
  };

  /* Message 3 is the OTHER channel type from condition */
  const conditionType = (condition <= 2) ? 'email' : 'forum';
  const msg3Type = (conditionType === 'email') ? 'forum' : 'email';

  const msg3Forum = { type:'forum', label:'Public Forum', icon:forumIconHTML,
    from:'Jordan Lee', initials:'JL', color:'#2db37a',
    subject:'#team-huddle — Q3 Satisfaction Survey Update',
    preview:'Hey team! Just wanted to share a quick update on the survey draft…',
    ccLine:'Posted in: #client-services-general',
    body:`Hey team!

Just wanted to share a quick update on the Q3 satisfaction survey. I've finished the first draft and I'm planning to include an NPS section for the first time — seems like clients have been asking for it. If anyone has thoughts before I send it up the chain, drop them here.

Also, side note: the Vertex Data onboarding is looking solid so far. Riley's done a great job getting them oriented. More updates to come!`,
    sig:'— Jordan' };

  const msg3Email = { type:'email', label:'Email', icon:emailIconHTML,
    from:'Jordan Lee', initials:'JL', color:'#2db37a',
    subject:'Q3 Satisfaction Survey — Draft Ready for Review',
    preview:'Hi, I\'ve finished the first draft of the Q3 satisfaction survey…',
    ccLine:'To: You',
    body:`Hi [Your Name],

I've finished the first draft of the Q3 satisfaction survey and wanted to give you a heads up before sending it along for approval. I've added an NPS section this time around — clients have been requesting it and I think it'll give us cleaner benchmarks.

Also just wanted to note: the Vertex Data onboarding has been going really smoothly. Riley's doing a fantastic job over there.

Let me know if you'd like to review the draft before it goes out!`,
    sig:'Best,\nJordan' };

  const msg3 = (msg3Type === 'forum') ? msg3Forum : msg3Email;

  /* Build all 4 messages in order */
  const messages = [
    /* msg 1: always email */
    { type:'email', label:'Email', icon:emailIconHTML,
      from:'Riley Torres', initials:'RT', color:'#f472b6',
      subject:'Vertex Data Onboarding — Contract Signed',
      preview:'Great news — Vertex Data just sent over their signed contract!',
      ccLine:'To: You',
      body:`Hi [Your Name],

Great news — Vertex Data just sent over their signed contract! I'm planning to kick off the onboarding checklist this week and should have a draft ready by EOD Thursday.

One thing I want to flag early: given the situation with the Nexagen account, I've added an explicit QA sign-off step before any go-live declaration. Just thought it was worth building that in from the start.

Let me know if you'd like to sync before I send the client their onboarding welcome packet.`,
      sig:'Best,\nRiley' },

    /* msg 2: always forum */
    { type:'forum', label:'Public Forum', icon:forumIconHTML,
      from:'Taylor Chen', initials:'TC', color:'#e09020',
      subject:'#team-updates — Nexagen Incident Logged',
      preview:'Heads up team — I\'ve logged the Nexagen incident in the system…',
      ccLine:'Posted in: #client-services-general',
      body:`Heads up team,

I've logged the Nexagen incident formally in the system. Legal has flagged it and wants documentation to be airtight going forward — so if anyone has notes, emails, or context from that week, now's the time to make sure they're in the shared folder.

The client complaint is being tracked under ticket #NEX-2247. If anyone has questions or updates related to that account, feel free to reply here or DM me directly.

Thanks,`,
      sig:'— Taylor' },

    /* msg 3: opposite channel from condition */
    msg3,

    /* msg 4: the condition message */
    conditionMsgs[condition]
  ];

  /* ── State ── */
  let currentMsg = 0; /* index of next message to unlock (0-based) */
  let tourPhase = 'intro'; /* intro → browsing → done */
  const overlay = document.getElementById('tourOverlay');
  const sparky = document.getElementById('sparky');
  const sparkyText = document.getElementById('sparky-text');
  const sparkyBtn = document.getElementById('sparky-btn');

  /* ── Render message list ── */
  function renderMessages() {
    const container = document.getElementById('msgContent');
    container.innerHTML = '';
    messages.forEach((m, i) => {
      const row = document.createElement('div');
      row.className = 'msg-row unread' + (i > currentMsg ? ' locked' : '') + (i < currentMsg ? ' read' : '');
      row.id = 'msg-row-' + i;
      row.innerHTML = `
        <div class="row-av" style="background:${m.color}">${m.initials}</div>
        <div class="row-body">
          <div class="row-from">${m.from}</div>
          <div class="row-subject">${m.subject}</div>
          <div class="row-preview">${m.preview}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">
          <div class="row-time">Today</div>
          <div class="row-type">${m.icon} ${m.label}</div>
        </div>`;
      row.addEventListener('click', () => handleMsgClick(i));
      container.appendChild(row);
    });

    /* Apply spotlight to current msg if in browsing phase */
    if (tourPhase === 'browsing') {
      document.getElementById('msg-row-' + currentMsg)?.classList.add('spotlight-item');
    }
  }

  function handleMsgClick(i) {
    if (i !== currentMsg) {
      if (i < currentMsg) return; /* already read, no action */
      /* locked — nag */
      showNag('Please click the top unread message to continue!');
      return;
    }
    /* open message view */
    const m = messages[i];
    sessionStorage.setItem('currentMsg', JSON.stringify({ ...m, index: i, condition, total: messages.length }));
    window.location.href = 'message-view.html?c=' + condition + '&i=' + i;
  }

  /* Called when returning from message-view */
  function returnFromMessage(index) {
    currentMsg = index + 1;

    if (currentMsg < messages.length) {
      /* No overlay — just render the list and inject inline Sparky beside the next row */
      overlay.classList.remove('active');
      sparky.style.display = 'none';
      renderMessages();

      /* Small delay so the row is in the DOM */
      setTimeout(() => {
        const nextRow = document.getElementById('msg-row-' + currentMsg);
        if (!nextRow) return;

        /* Remove the box-shadow spotlight; instead highlight with border only */
        nextRow.classList.add('spotlight-item');

        /* Build an inline Sparky callout that floats beside the row */
        const old = document.getElementById('inline-sparky');
        if (old) old.remove();

        const nextMsg = messages[currentMsg];
        const typeLabel = nextMsg.type === 'email' ? 'an <b>email</b>' : 'a <b>public forum message</b>';

        const bubble = document.createElement('div');
        bubble.id = 'inline-sparky';
        bubble.style.cssText = `
          position:fixed; z-index:650;
          display:flex; align-items:center; gap:10px;
          background:#fff; border:1.5px solid #5b6af7;
          border-radius:14px; padding:10px 14px;
          box-shadow:0 4px 20px rgba(0,0,0,.13);
          font-family:Inter,sans-serif; font-size:13px; color:#333;
          max-width:380px; line-height:1.5;
          pointer-events:none;
        `;

        /* Position it to the right of the message row */
        const rect = nextRow.getBoundingClientRect();
        bubble.style.top = (rect.top + rect.height/2 - 30) + 'px';
        bubble.style.left = (rect.right + 14) + 'px';

        bubble.innerHTML = `
          <svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg" style="width:40px;height:40px;flex-shrink:0;">
            <ellipse cx="45" cy="48" rx="20" ry="26" fill="#5b6af7"/>
            <ellipse cx="45" cy="44" rx="14" ry="14" fill="#fff" opacity=".95"/>
            <circle cx="40" cy="41" r="3" fill="#1a1a1a"/><circle cx="50" cy="41" r="3" fill="#1a1a1a"/>
            <circle cx="41.2" cy="39.8" r="1" fill="#fff"/><circle cx="51.2" cy="39.8" r="1" fill="#fff"/>
            <path d="M39 47 Q45 52 51 47" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="45" y1="22" x2="45" y2="30" stroke="#5b6af7" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="45" cy="20" r="4" fill="#fbbf24"/>
            <ellipse cx="20" cy="52" rx="10" ry="6" fill="#818cf8" transform="rotate(-20 20 52)"/>
            <ellipse cx="70" cy="52" rx="10" ry="6" fill="#818cf8" transform="rotate(20 70 52)"/>
            <ellipse cx="45" cy="77" rx="8" ry="5" fill="#fb923c" opacity=".9"/>
          </svg>
          <div>Now let's check the next message. This one's ${typeLabel}!</div>
        `;
        document.body.appendChild(bubble);

        /* Remove bubble once they click the row */
        nextRow.style.pointerEvents = 'auto';
        nextRow.addEventListener('click', () => { bubble.remove(); }, { once: true });
      }, 80);

    } else {
      /* All messages read — show survey */
      overlay.classList.add('active');
      sparky.style.display = '';
      sparkyCenter();
      sparkyText.innerHTML = 'You\'ve read all your messages! Before we move on, I have a few questions about that last message.';
      sparkyBtn.textContent = 'Answer questions →';
      sparkyBtn.onclick = () => {
        overlay.classList.remove('active');
        sparky.style.display = 'none';
        buildScales();
        document.getElementById('surveyModal').classList.add('active');
      };
    }
  }

  function sparkyCenter() {
    sparky.style.transition = 'all 0.4s';
    sparky.style.left = '50%'; sparky.style.top = '50%';
    sparky.style.transform = 'translate(-50%, -50%)';
    document.getElementById('sparky-char').style.cssText = 'width:90px;height:90px;transition:all 0.4s;filter:drop-shadow(0 4px 12px rgba(0,0,0,.25));';
    document.getElementById('sparky-bubble').style.display = '';
    sparkyBtn.style.display = '';
  }

  function sparkyCorner() {
    sparky.style.transition = 'all 0.5s cubic-bezier(.34,1.3,.7,1)';
    sparky.style.left = '14px'; sparky.style.top = '14px';
    sparky.style.transform = 'none';
    document.getElementById('sparky-char').style.cssText = 'width:36px;height:36px;transition:all 0.5s;';
    document.getElementById('sparky-bubble').style.display = 'none';
  }

  function showNag(msg) {
    overlay.classList.add('active');
    sparkyCenter();
    sparkyText.innerHTML = msg;
    sparkyBtn.style.display = 'none';
    setTimeout(() => {
      overlay.classList.remove('active');
      sparkyCorner();
      renderMessages();
      document.getElementById('msg-row-' + currentMsg)?.classList.add('spotlight-item');
    }, 2500);
  }

  function sidebarBlock() {
    showNag('Finish reading your messages first — the tour isn\'t done yet!');
  }

  /* ── Survey ── */
  function buildScales() {
    ['mq1','mq2','mq3','mq4'].forEach(id => {
      const el = document.getElementById(id);
      if (!el || el.children.length > 0) return;
      for (let i=1;i<=7;i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.onclick = function() { el.querySelectorAll('button').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); };
        el.appendChild(btn);
      }
    });
  }

  function submitSurvey() {
    document.getElementById('surveyModal').classList.remove('active');
    /* Sparky final message */
    overlay.classList.add('active');
    sparky.style.display = '';
    sparkyCenter();
    sparkyText.innerHTML = 'Thank you so much for your responses! You\'ve completed the messages section. The study will now continue.';
    sparkyBtn.textContent = 'Continue →';
    sparkyBtn.style.display = '';
    sparkyBtn.onclick = () => {
      /* In real study: go to next page/task. For now, done. */
      overlay.classList.remove('active');
      sparkyCorner();
    };
  }

  /* ── Init ── */
  window.addEventListener('load', () => {
    /* Check if returning from message-view */
    const ret = sessionStorage.getItem('returnFromMsg');
    if (ret !== null) {
      const retIdx = parseInt(ret);
      sessionStorage.removeItem('returnFromMsg');
      tourPhase = 'browsing';
      renderMessages();
      returnFromMessage(retIdx);
      return;
    }

    /* Fresh load: show intro */
    overlay.classList.add('active');
    sparkyCenter();
    sparkyText.innerHTML = 'Welcome to the <strong>Messages page!</strong> We\'ve collapsed your emails and the company\'s public forum into one page so it\'s easy to find all your most recent communications!<br><br>It looks like you have <strong>4 messages</strong> — 2 emails and 2 public forums.<br><br>Emails are indicated by the <strong>mail &amp; single person</strong> icon. Forums are indicated by the <strong>multiple people &amp; send</strong> icon.<br><br>Let\'s click on the top one to get started!';
    sparkyBtn.textContent = 'Got it →';
    sparkyBtn.onclick = () => {
      overlay.classList.remove('active');
      tourPhase = 'browsing';
      sparkyCorner();
      renderMessages();
      document.getElementById('msg-row-0')?.classList.add('spotlight-item');
    };

    renderMessages();
  });
</script>
</body>
</html>
